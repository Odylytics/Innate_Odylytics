<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app use the full screen around the notch; safe areas are padded in collect.css -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1B2A" />
    <meta name="description" content="Innate scores behavioral risk for e-wallets: it spots strangers and malware even when they type the right PIN." />
    <title>Innate · Passwords can be stolen. Habits can’t.</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- "website as app": installable from the browser (Add to Home Screen), opens full screen on #/collect -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Innate" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Theme before first paint (DEMO_DESIGN_RULES.md): dark by default, the nav toggle stores the choice.
      try {
        var t = localStorage.getItem('innate.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <!-- Figma brand kit: Sora (display, latin only) + Manrope (UI/body, has Vietnamese). JetBrains Mono for data. All OFL. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
