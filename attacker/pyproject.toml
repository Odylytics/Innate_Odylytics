[project]
name = "nhip-attacker"
version = "0.1.0"
description = "Innate — hacker simulator: generates bot sessions with 4 tactics and attacks a real phone via adb"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
