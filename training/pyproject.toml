[project]
name = "innate-training"
version = "0.1.0"
description = "Innate 4-layer DL training pipeline (research; not a backend runtime dependency)"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "numpy>=1.26", "onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1",
    "fastapi>=0.115", "httpx>=0.27", "sqlalchemy>=2.0", "pytest>=8"]  # fastapi/sqlalchemy/httpx: the dry run scores through the backend app in-process

[tool.pytest.ini_options]
pythonpath = [".", "../backend"]
testpaths = ["tests"]
