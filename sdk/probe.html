<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Innate IME probe</title>
<!-- Open on a real phone (Gboard/iOS, Telex and VNI), type "trời đẹp quá", then tap Copy log and send it to the team. Nothing is sent over the network. -->
<style>body{font:16px system-ui;margin:16px}textarea,input{width:100%;box-sizing:border-box;font-size:18px}pre{white-space:pre-wrap;font-size:12px}</style>
<p>Keyboard: <b id="ua"></b></p>
<input id="t" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="vi" placeholder="type: trời đẹp quá">
<p><button id="copy">Copy log</button> <button id="clr">Clear</button></p>
<pre id="log"></pre>
<script>
const t=document.getElementById("t"),log=document.getElementById("log"),rows=[];let prev=0,t0=null;
document.getElementById("ua").textContent=navigator.userAgent;
const add=(e)=>{t0??=performance.now();const L=t.value.length;rows.push([Math.round(performance.now()-t0),e.type,e.inputType||"",e.keyCode??"",e.key??"",e.isComposing??"",L-prev].join("\t"));prev=L;log.textContent="t\ttype\tinputType\tkeyCode\tkey\tcomposing\tdLen\n"+rows.join("\n")};
["keydown","beforeinput","input","compositionstart","compositionupdate","compositionend"].forEach((n)=>t.addEventListener(n,add));
document.getElementById("copy").onclick=()=>navigator.clipboard?.writeText(log.textContent).catch(()=>{});
document.getElementById("clr").onclick=()=>{rows.length=0;log.textContent="";t.value="";prev=0;t0=null};
</script>
