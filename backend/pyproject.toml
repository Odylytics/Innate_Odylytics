[project]
name = "nhip-backend"
version = "0.1.0"
description = "Innate — API chấm điểm rủi ro hành vi"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
ml = []  # giữ để lệnh `uv sync --extra ml` cũ vẫn chạy. Suy luận mô hình học dùng app/scoring/lgbm_text.py (Python thuần), không cần lightgbm/numpy/libgomp

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "lightgbm>=4.0"]  # lightgbm chỉ để kiểm tương đương trong tests/test_lgbm_text.py

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
