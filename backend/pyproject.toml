[project]
name = "nhip-backend"
version = "0.1.0"
description = "Innate — API chấm điểm rủi ro hành vi"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "lightgbm>=4.0",  # mô hình học người/máy và nhận chủ; thiếu thư viện hoặc libgomp thì backend tự rơi về luật (xem /health)
    "numpy>=1.26",
]

[project.optional-dependencies]
ml = []  # giữ để lệnh `uv sync --extra ml` cũ vẫn chạy: lightgbm và numpy nay là phụ thuộc mặc định

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
