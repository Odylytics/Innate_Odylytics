[project]
name = "nhip-backend"
version = "0.1.0"
description = "Innate — behavioral risk scoring API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
ml = []  # kept so the old `uv sync --extra ml` command still works. Learned-model inference uses app/scoring/lgbm_text.py (pure Python), no lightgbm/numpy/libgomp needed

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "lightgbm>=4.0"]  # lightgbm is only for the equivalence check in tests/test_lgbm_text.py

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
